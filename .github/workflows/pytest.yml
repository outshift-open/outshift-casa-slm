name: pytest

on:
  pull_request:
  push:
    branches: [ main ]

defaults:
  run:
    shell: bash -l {0}

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          environments: dev

      - name: Run pytest
        run: pixi run test
